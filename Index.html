                                    <option value="piece">piece</option>
                                    <option value="cup">cup</option>
                                    <option value="tbsp">tbsp</option>
                                    <option value="tsp">tsp</option>
                                    <option value="oz">oz</option>
                                    <option value="ml">ml</option>
                                </select>
                            </div>
                        </div>

                        <div className="bg-darkBg/60 p-4 rounded-2xl border border-white/5 space-y-3">
                            <div className="flex justify-between items-center font-bold text-base">
                                <span>Total Calories</span>
                                <span className="text-primary text-xl">{scaled.calories} kcal</span>
                            </div>
                            <div className="grid grid-cols-3 gap-2 pt-2 border-t border-white/5 text-center text-xs">
                                <div className="bg-white/5 p-2 rounded-xl">
                                    <span className="text-slate-400 block text-[10px]">Protein</span>
                                    <span className="font-bold text-white">{scaled.protein}g</span>
                                </div>
                                <div className="bg-white/5 p-2 rounded-xl">
                                    <span className="text-slate-400 block text-[10px]">Carbs</span>
                                    <span className="font-bold text-white">{scaled.carbs}g</span>
                                </div>
                                <div className="bg-white/5 p-2 rounded-xl">
                                    <span className="text-slate-400 block text-[10px]">Fat</span>
                                    <span className="font-bold text-white">{scaled.fat}g</span>
                                </div>
                            </div>
                        </div>

                        <div className="flex space-x-3 pt-2">
                            <button onClick={onClose} className="flex-1 py-3 bg-white/5 rounded-xl text-xs font-medium">Cancel</button>
                            <button onClick={handleAdd} className="flex-1 py-3 bg-primary text-white rounded-xl text-xs font-bold shadow-lg shadow-primary/30">Add to {category}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function CustomFoodModal({onClose, onSave}) {
            const [form, setForm] = useState({
                name: '',
                calories: 200,
                protein: 10,
                carbs: 20,
                fat: 5,
                fiber: 2,
                sodium: 100,
                servingSize: 100,
                servingUnit: 'g'
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!form.name) return;
                onSave({
                    id: 'custom-' + Date.now(),
                    ...form,
                    category: 'Custom',
                    source: 'Custom food — user supplied'
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-darkBg/80 backdrop-blur-md">
                    <div className="bg-cardBg border border-white/10 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-6">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-lg">Create Custom Food</h3>
                                <p className="text-xs text-slate-400">Labeled as custom food — user supplied.</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-medium text-slate-300 mb-1">Food Name</label>
                                <input
                                    type="text"
                                    required
                                    placeholder="e.g. Grandma's Protein Smoothie"
                                    value={form.name}
                                    onChange={e => setForm({...form, name: e.target.value})}
                                    className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-medium text-slate-300 mb-1">Calories (kcal)</label>
                                    <input type="number" required value={form.calories} onChange={e => setForm({...form, calories: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-300 mb-1">Protein (g)</label>
                                    <input type="number" required value={form.protein} onChange={e => setForm({...form, protein: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-300 mb-1">Carbs (g)</label>
                                    <input type="number" required value={form.carbs} onChange={e => setForm({...form, carbs: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-300 mb-1">Fat (g)</label>
                                    <input type="number" required value={form.fat} onChange={e => setForm({...form, fat: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                                </div>
                            </div>

                            <div className="flex space-x-3 pt-4">
                                <button type="button" onClick={onClose} className="flex-1 py-3 bg-white/5 rounded-xl text-xs font-medium">Cancel</button>
                                <button type="submit" className="flex-1 py-3 bg-primary text-white rounded-xl text-xs font-bold shadow-lg shadow-primary/30">Save Custom Food</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ProgressView({weightLogs, profile, onOpenWeightLog}) {
            const currentWeight = weightLogs[weightLogs.length - 1]?.weight || profile.weight;
            const startWeight = weightLogs[0]?.weight || profile.weight;
            const totalChange = Number((currentWeight - startWeight).toFixed(1));

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-cardBg/60 p-6 rounded-3xl border border-white/5 backdrop-blur-xl">
                        <div>
                            <h2 className="text-2xl font-bold">Progress & Weight Tracking</h2>
                            <p className="text-sm text-slate-400 mt-1">Review weight trends and rolling averages over time.</p>
                        </div>
                        <button
                            onClick={onOpenWeightLog}
                            className="px-5 py-2.5 bg-primary text-white rounded-xl text-xs font-bold shadow-lg shadow-primary/30 flex items-center space-x-2"
                        >
                            <i data-lucide="plus" className="w-4 h-4"></i>
                            <span>Log Weight</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-cardBg/80 border border-white/5 p-5 rounded-3xl backdrop-blur-xl">
                            <span className="text-xs text-slate-400">Current Weight</span>
                            <div className="text-3xl font-extrabold text-white mt-1">{currentWeight} <span className="text-sm font-normal text-slate-400">{profile.unitSystem === 'metric' ? 'kg' : 'lbs'}</span></div>
                        </div>
                        <div className="bg-cardBg/80 border border-white/5 p-5 rounded-3xl backdrop-blur-xl">
                            <span className="text-xs text-slate-400">Goal Weight</span>
                            <div className="text-3xl font-extrabold text-primary mt-1">{profile.goalWeight} <span className="text-sm font-normal text-slate-400">{profile.unitSystem === 'metric' ? 'kg' : 'lbs'}</span></div>
                        </div>
                        <div className="bg-cardBg/80 border border-white/5 p-5 rounded-3xl backdrop-blur-xl">
                            <span className="text-xs text-slate-400">Total Change</span>
                            <div className={`text-3xl font-extrabold mt-1 ${totalChange <= 0 ? 'text-success' : 'text-warning'}`}>{totalChange > 0 ? `+${totalChange}` : totalChange} <span className="text-sm font-normal text-slate-400">{profile.unitSystem === 'metric' ? 'kg' : 'lbs'}</span></div>
                        </div>
                    </div>

                    {/* Recharts Chart */}
                    <div className="bg-cardBg/80 border border-white/5 p-6 rounded-3xl backdrop-blur-xl shadow-xl space-y-4">
                        <h3 className="font-bold text-base">Weight Trend History</h3>
                        <div className="h-72 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={weightLogs}>
                                    <defs>
                                        <linearGradient id="weightGrad" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#7C5CFC" stopOpacity={0.4} />
                                            <stop offset="95%" stopColor="#7C5CFC" stopOpacity={0} />
                                        </linearGradient>
                                    </defs>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#1e2633" />
                                    <XAxis dataKey="date" stroke="#64748b" fontSize={11} />
                                    <YAxis stroke="#64748b" fontSize={11} domain={['dataMin - 2', 'dataMax + 2']} />
                                    <Tooltip contentStyle={{backgroundColor: '#11151C', borderColor: '#1e2633', borderRadius: '12px', color: '#fff'}} />
                                    <Area type="monotone" dataKey="weight" stroke="#7C5CFC" strokeWidth={3} fillOpacity={1} fill="url(#weightGrad)" />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>
                        <p className="text-xs text-slate-500 text-center">Daily water weight fluctuations are normal. Focus on rolling multi-week trends.</p>
                    </div>
                </div>
            );
        }

        function WeightLogModal({currentWeights, unit, onClose, onSave}) {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [weight, setWeight] = useState(currentWeights[currentWeights.length - 1]?.weight || 75);

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({date, weight: Number(weight)});
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-darkBg/80 backdrop-blur-md">
                    <div className="bg-cardBg border border-white/10 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-6">
                        <div className="flex justify-between items-center">
                            <h3 className="font-bold text-lg">Log Weight</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-medium text-slate-300 mb-1">Date</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-slate-300 mb-1">Weight ({unit === 'metric' ? 'kg' : 'lbs'})</label>
                                <input type="number" step="0.1" value={weight} onChange={e => setWeight(e.target.value)} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-sm font-bold text-slate-100 focus:outline-none focus:border-primary font-mono" autoFocus />
                            </div>
                            <div className="flex space-x-3 pt-2">
                                <button type="button" onClick={onClose} className="flex-1 py-3 bg-white/5 rounded-xl text-xs font-medium">Cancel</button>
                                <button type="submit" className="flex-1 py-3 bg-primary text-white rounded-xl text-xs font-bold shadow-lg shadow-primary/30">Save Weight</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ExerciseLogModal({selectedDate, onClose, onSave}) {
            const [form, setForm] = useState({
                type: 'Running',
                duration: 30,
                caloriesBurned: 300,
                intensity: 'Moderate'
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    id: 'ex-' + Date.now(),
                    ...form
                }, selectedDate);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-darkBg/80 backdrop-blur-md">
                    <div className="bg-cardBg border border-white/10 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-6">
                        <div className="flex justify-between items-center">
                            <h3 className="font-bold text-lg">Log Workout</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-medium text-slate-300 mb-1">Workout Type</label>
                                <select value={form.type} onChange={e => setForm({...form, type: e.target.value})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary">
                                    <option value="Running">Running</option>
                                    <option value="Walking">Walking</option>
                                    <option value="Cycling">Cycling</option>
                                    <option value="Gym">Gym / Resistance Training</option>
                                    <option value="Swimming">Swimming</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-medium text-slate-300 mb-1">Duration (mins)</label>
                                    <input type="number" value={form.duration} onChange={e => setForm({...form, duration: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-300 mb-1">Est. Calories Burned</label>
                                    <input type="number" value={form.caloriesBurned} onChange={e => setForm({...form, caloriesBurned: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                                </div>
                            </div>
                            <div className="flex space-x-3 pt-4">
                                <button type="button" onClick={onClose} className="flex-1 py-3 bg-white/5 rounded-xl text-xs font-medium">Cancel</button>
                                <button type="submit" className="flex-1 py-3 bg-primary text-white rounded-xl text-xs font-bold shadow-lg shadow-primary/30">Save Workout</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function CalendarHistoryView({mealsLog, weightLogs, exerciseLogs, profile, onSelectDay}) {
            // Generate current month days
            const days = Array.from({length: 30}, (_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - (29 - i));
                return d.toISOString().split('T')[0];
            });

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-cardBg/60 p-6 rounded-3xl border border-white/5 backdrop-blur-xl">
                        <h2 className="text-2xl font-bold">Calendar History</h2>
                        <p className="text-sm text-slate-400 mt-1">Click any day to review full logs, meals, and weight records.</p>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                        {days.map(dateStr => {
                            const dayMeals = mealsLog[dateStr] || {breakfast: [], lunch: [], dinner: [], snacks: []};
                            const cals = ['breakfast', 'lunch', 'dinner', 'snacks'].reduce((acc, cat) => acc + (dayMeals[cat] || []).reduce((a, c) => a + c.calories, 0), 0);
                            const hasData = cals > 0;
                            const status = cals === 0 ? 'no-data' : cals <= profile.targetCalories ? 'achieved' : 'above';

                            return (
                                <div
                                    key={dateStr}
                                    onClick={() => onSelectDay(dateStr)}
                                    className={`bg-cardBg/80 border p-4 rounded-2xl backdrop-blur-xl cursor-pointer transition-all hover:scale-105 flex flex-col justify-between ${status === 'achieved' ? 'border-success/40 bg-success/5' : status === 'above' ? 'border-warning/40 bg-warning/5' : 'border-white/5'}`}
                                >
                                    <div className="text-[11px] font-mono text-slate-400">{dateStr.slice(5)}</div>
                                    <div className="my-3">
                                        <div className="text-lg font-bold text-white">{cals}</div>
                                        <div className="text-[10px] text-slate-500">kcal</div>
                                    </div>
                                    <div className={`text-[10px] font-semibold px-2 py-0.5 rounded-md inline-block w-fit ${status === 'achieved' ? 'text-success bg-success/10' : status === 'above' ? 'text-warning bg-warning/10' : 'text-slate-500 bg-white/5'}`}>
                                        {status === 'achieved' ? 'On Target' : status === 'above' ? 'Above' : 'No Data'}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function DayDetailModal({dateStr, meals, weight, exercises, profile, onClose}) {
            const dayMeals = meals || {breakfast: [], lunch: [], dinner: [], snacks: []};
            const totalCals = ['breakfast', 'lunch', 'dinner', 'snacks'].reduce((acc, cat) => acc + (dayMeals[cat] || []).reduce((a, c) => a + c.calories, 0), 0);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-darkBg/80 backdrop-blur-md">
                    <div className="bg-cardBg border border-white/10 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center">
                            <div>
                                <span className="text-xs text-primary font-mono">{dateStr}</span>
                                <h3 className="font-bold text-xl">Daily Summary</h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-darkBg/50 p-4 rounded-2xl border border-white/5">
                                <span className="text-xs text-slate-400">Total Consumed</span>
                                <div className="text-xl font-bold text-white mt-1">{totalCals} <span className="text-xs font-normal text-slate-400">/ {profile.targetCalories} kcal</span></div>
                            </div>
                            <div className="bg-darkBg/50 p-4 rounded-2xl border border-white/5">
                                <span className="text-xs text-slate-400">Weight Recorded</span>
                                <div className="text-xl font-bold text-white mt-1">{weight ? `${weight.weight} kg` : 'None'}</div>
                            </div>
                        </div>

                        {exercises && exercises.length > 0 && (
                            <div>
                                <h4 className="font-bold text-sm mb-2 text-slate-300">Workouts</h4>
                                {exercises.map(ex => (
                                    <div key={ex.id} className="bg-darkBg/40 p-3 rounded-xl border border-white/5 flex justify-between items-center text-xs mb-1">
                                        <span>{ex.type} ({ex.duration} mins)</span>
                                        <span className="font-mono text-success">+{ex.caloriesBurned} kcal</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        <div>
                            <h4 className="font-bold text-sm mb-2 text-slate-300">Meals Logged</h4>
                            {['breakfast', 'lunch', 'dinner', 'snacks'].map(cat => {
                                const list = dayMeals[cat] || [];
                                if (list.length === 0) return null;
                                return (
                                    <div key={cat} className="mb-3">
                                        <span className="text-xs font-semibold text-primary uppercase tracking-wider">{cat}</span>
                                        {list.map(item => (
                                            <div key={item.id} className="flex justify-between items-center bg-darkBg/40 p-2.5 rounded-xl border border-white/5 text-xs mt-1">
                                                <span>{item.name} ({item.amount}{item.unit})</span>
                                                <span className="font-mono font-bold">{item.calories} kcal</span>
                                            </div>
                                        ))}
                                    </div>
                                );
                            })}
                        </div>

                        <button onClick={onClose} className="w-full py-3 bg-white/5 rounded-xl text-xs font-medium">Close Summary</button>
                    </div>
                </div>
            );
        }

        function AnalyticsView({mealsLog, weightLogs, exerciseLogs, profile}) {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-cardBg/60 p-6 rounded-3xl border border-white/5 backdrop-blur-xl">
                        <h2 className="text-2xl font-bold">Analytics & Insights</h2>
                        <p className="text-sm text-slate-400 mt-1">Smart trends and metabolic progress analysis.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-cardBg/80 border border-white/5 p-6 rounded-3xl backdrop-blur-xl space-y-4">
                            <h3 className="font-bold text-base">Key Insights</h3>
                            <div className="space-y-3">
                                <div className="p-4 bg-primary/10 border border-primary/20 rounded-2xl flex items-start space-x-3">
                                    <i data-lucide="sparkles" className="w-5 h-5 text-primary shrink-0 mt-0.5"></i>
                                    <p className="text-xs text-slate-200">
                                        Your weight trend has decreased steadily over the selected period. Consistency is compounding your results!
                                    </p>
                                </div>
                                <div className="p-4 bg-success/10 border border-success/20 rounded-2xl flex items-start space-x-3">
                                    <i data-lucide="check-circle-2" className="w-5 h-5 text-success shrink-0 mt-0.5"></i>
                                    <p className="text-xs text-slate-200">
                                        Average calorie intake remains well aligned with your sustainable target deficit of ~500 kcal/day.
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-cardBg/80 border border-white/5 p-6 rounded-3xl backdrop-blur-xl space-y-4">
                            <h3 className="font-bold text-base">Goal Progress</h3>
                            <div className="space-y-4 pt-2">
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="text-slate-400">Weight Goal Progress</span>
                                        <span className="font-bold text-white">74%</span>
                                    </div>
                                    <div className="w-full bg-darkBg h-3 rounded-full overflow-hidden border border-white/5">
                                        <div className="bg-gradient-to-r from-primary to-success h-full w-[74%]"></div>
                                    </div>
                                </div>
                                <div className="p-4 bg-darkBg/50 rounded-2xl border border-white/5 text-xs text-slate-400 space-y-2">
                                    <div className="flex justify-between">
                                        <span>Estimated Maintenance TDEE:</span>
                                        <span className="font-mono text-white">{profile.tdee} kcal</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span>Current Target Deficit:</span>
                                        <span className="font-mono text-success">{profile.tdee - profile.targetCalories} kcal/day</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function SettingsView({profile, setProfile, settings, setSettings, showToast}) {
            const [form, setForm] = useState(profile);

            const handleSave = (e) => {
                e.preventDefault();
                setProfile(form);
                showToast('Profile updated successfully!');
            };

            const handleExport = () => {
                const data = {profile, settings, weights: localStorage.getItem('calorieos_weights'), meals: localStorage.getItem('calorieos_meals')};
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'calorieos_backup.json';
                a.click();
                showToast('Data exported successfully!');
            };

            const handleClearData = () => {
                if (confirm('Are you sure you want to clear all data and restart onboarding?')) {
                    localStorage.clear();
                    window.location.reload();
                }
            };

            return (
                <div className="space-y-6 max-w-2xl mx-auto animate-fade-in">
                    <div className="bg-cardBg/60 p-6 rounded-3xl border border-white/5 backdrop-blur-xl">
                        <h2 className="text-2xl font-bold">Settings & Profile</h2>
                        <p className="text-sm text-slate-400 mt-1">Manage your biometric profile, USDA API preferences, and local storage.</p>
                    </div>

                    <form onSubmit={handleSave} className="bg-cardBg/80 border border-white/5 p-6 rounded-3xl backdrop-blur-xl space-y-4 shadow-xl">
                        <h3 className="font-bold text-base mb-2">Edit Biometrics & Targets</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-medium text-slate-300 mb-1">Age</label>
                                <input type="number" value={form.age} onChange={e => setForm({...form, age: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary" />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-slate-300 mb-1">Daily Calorie Target</label>
                                <input type="number" value={form.targetCalories} onChange={e => setForm({...form, targetCalories: Number(e.target.value)})} className="w-full bg-darkBg border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-primary font-mono" />
                            </div>
                        </div>
                        <button type="submit" className="w-full py-3 bg-primary text-white rounded-xl text-xs font-bold shadow-lg shadow-primary/30">Save Profile Changes</button>
                    </form>

                    <div className="bg-cardBg/80 border border-white/5 p-6 rounded-3xl backdrop-blur-xl space-y-4 shadow-xl">
                        <h3 className="font-bold text-base">Data Management & Privacy</h3>
                        <p className="text-xs text-slate-400">All data is stored securely in your browser's local storage. No proprietary backend required.</p>

                        <div className="flex flex-wrap gap-3 pt-2">
                            <button onClick={handleExport} className="px-4 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs font-medium">Export Backup (JSON)</button>
                            <button onClick={handleClearData} className="px-4 py-2.5 bg-danger/10 hover:bg-danger/20 text-danger border border-danger/30 rounded-xl text-xs font-medium">Clear All Data</button>
                        </div>
                    </div>
                </div>
            );
        }

        function DisclaimerModal({onClose}) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-darkBg/80 backdrop-blur-md">
                    <div className="bg-cardBg border border-white/10 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 className="font-bold text-lg">Medical Disclaimer</h3>
                        <p className="text-xs text-slate-300 leading-relaxed">
                            "Calorie and energy expenditure values are estimates and may differ from your actual needs. This application is intended for general informational and tracking purposes and is not medical advice. Consult a qualified healthcare professional for individualized nutrition or weight-management advice."
                        </p>
                        <button onClick={onClose} className="w-full py-3 bg-primary text-white rounded-xl text-xs font-bold shadow-lg shadow-primary/30">I Understand</button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 100);
    </script>
</body>

</html>
